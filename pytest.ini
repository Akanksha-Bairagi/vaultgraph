[pytest]
testpaths = tests
filterwarnings =
    # Third-party deprecation emitted by older Starlette + httpx>=0.28 TestClient combinations. Upgrading fastapi>=0.115
    # (pinned in requirements.txt) removes it; this keeps the output clean if an older Starlette is already installed.
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
