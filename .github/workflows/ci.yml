name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.11", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q        # ACL-leak, injection, upload, auth and API regression tests
      - run: python -m eval.run_eval
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vaultgraph .
      - run: |
          docker run -d --name vg -p 7860:7860 -e JWT_SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))") -e DEMO_MODE=true vaultgraph
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break || sleep 2; done
          curl -fs localhost:7860/ | grep -q "<div id=\"root\">"
          curl -fs localhost:7860/auth/config | grep -q demo_mode
